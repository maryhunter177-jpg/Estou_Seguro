services:
  - type: web
    name: estou-seguro-api-sandbox
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: sandbox
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: estou-seguro-postgres-sandbox
          property: connectionString
      - key: DATABASE_USER
        fromDatabase:
          name: estou-seguro-postgres-sandbox
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: estou-seguro-postgres-sandbox
          property: password
      - key: DEVICE_TOKEN_PEPPER
        generateValue: true
      - key: CONSENT_TOKEN_PEPPER
        generateValue: true
      - key: SANDBOX_REGISTRATION_KEY
        generateValue: true
      - key: META_GRAPH_VERSION
        value: v26.0
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN
        generateValue: true
      - key: META_TEMPLATE_NAME
        value: alerta_emergencia
      - key: META_TEMPLATE_LANGUAGE
        value: pt_BR
      - key: WORKER_ENABLED
        value: "false"

databases:
  - name: estou-seguro-postgres-sandbox
    plan: free
    region: ohio
    postgresMajorVersion: "18"
    databaseName: estou_seguro
    user: estou_seguro
    ipAllowList: []
