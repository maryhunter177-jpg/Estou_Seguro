services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: estou_seguro
      POSTGRES_USER: estou_seguro
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estou_seguro -d estou_seguro"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/estou_seguro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
